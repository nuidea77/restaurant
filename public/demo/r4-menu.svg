<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Arial, sans-serif">
<rect width="1200" height="630" fill="#fffaf0"/><rect x="20" y="20" width="1160" height="590" fill="none" stroke="#c084fc" stroke-width="6" rx="20"/>
<text x="600" y="110" font-size="52" font-weight="700" text-anchor="middle" fill="#4c1d95">Сансар Пэлас — Шинэ жилийн цэс</text>
<text x="80" y="200" font-size="38" font-weight="700" fill="#4c1d95">Гала оройн зоог — 220,000₮ (1 хүний)</text>
<text x="100" y="250" font-size="28" fill="#333">Хясаа, Үхрийн филе, Шампан 1 хундага, Десерт, Жимс</text>
<text x="80" y="330" font-size="38" font-weight="700" fill="#4c1d95">Корпорат 20 хүн — 3,200,000₮ (20 хүний)</text>
<text x="100" y="380" font-size="28" fill="#333">Хонины шорлог, Тахиа, Салат 3 төрөл, Архи 4 шил, Ундаа</text>
<text x="80" y="460" font-size="38" font-weight="700" fill="#4c1d95">Эконом — 110,000₮ (1 хүний)</text>
<text x="100" y="510" font-size="28" fill="#333">Салат, Гол хоол, Бялуу, Ундаа</text>
</svg>