<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Arial, sans-serif">
<rect width="1200" height="630" fill="#fffaf0"/><rect x="20" y="20" width="1160" height="590" fill="none" stroke="#d97706" stroke-width="6" rx="20"/>
<text x="600" y="110" font-size="52" font-weight="700" text-anchor="middle" fill="#7f1d1d">Алтан Од Ордон — Шинэ жилийн цэс</text>
<text x="80" y="200" font-size="38" font-weight="700" fill="#7f1d1d">Алтан багц — 180,000₮ (1 хүний)</text>
<text x="100" y="250" font-size="28" fill="#333">Хүйтэн зууш 4 төрөл, Үхрийн стейк, Шинэ жилийн бялуу, Жимс, Ундаа хязгааргүй</text>
<text x="80" y="330" font-size="38" font-weight="700" fill="#7f1d1d">VIP ширээ — 2,500,000₮ (10 хүний)</text>
<text x="100" y="380" font-size="28" fill="#333">Хонины ууц, Загасны тавгийн хоол, Вино 3 шил, Виски 1 шил, Жимсний тавиур</text>
<text x="80" y="460" font-size="38" font-weight="700" fill="#7f1d1d">Байгууллагын багц — 145,000₮ (1 хүний)</text>
<text x="100" y="510" font-size="28" fill="#333">Салат 2 төрөл, Тахианы мах, Бялуу, Ундаа</text>
</svg>