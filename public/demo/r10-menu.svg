<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="Arial, sans-serif">
<rect width="1200" height="500" fill="#fffaf0"/><rect x="20" y="20" width="1160" height="460" fill="none" stroke="#86efac" stroke-width="6" rx="20"/>
<text x="600" y="110" font-size="52" font-weight="700" text-anchor="middle" fill="#14532d">Эко Кафе Ресторан — Шинэ жилийн цэс</text>
<text x="80" y="200" font-size="38" font-weight="700" fill="#14532d">Ногоон багц — 60,000₮ (1 хүний)</text>
<text x="100" y="250" font-size="28" fill="#333">Ногоон салат, Цагаан хоолны гол хоол, Жимс, Цай</text>
<text x="80" y="330" font-size="38" font-weight="700" fill="#14532d">Холимог багц — 70,000₮ (1 хүний)</text>
<text x="100" y="380" font-size="28" fill="#333">Салат, Тахиа эсвэл загас, Бялуу, Ундаа</text>
</svg>