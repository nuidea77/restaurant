<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Arial, sans-serif">
<rect width="1200" height="630" fill="#fffaf0"/><rect x="20" y="20" width="1160" height="590" fill="none" stroke="#f472b6" stroke-width="6" rx="20"/>
<text x="600" y="110" font-size="52" font-weight="700" text-anchor="middle" fill="#831843">Гранд Хүлээн авалт — Шинэ жилийн цэс</text>
<text x="80" y="200" font-size="38" font-weight="700" fill="#831843">Классик — 120,000₮ (1 хүний)</text>
<text x="100" y="250" font-size="28" fill="#333">Хүйтэн зууш 3, Тахианы филе, Бялуу, Ундаа</text>
<text x="80" y="330" font-size="38" font-weight="700" fill="#831843">Гранд — 165,000₮ (1 хүний)</text>
<text x="100" y="380" font-size="28" fill="#333">Хүйтэн зууш 5, Үхрийн стейк, Вино 1 хундага, Бялуу, Жимс</text>
<text x="80" y="460" font-size="38" font-weight="700" fill="#831843">Ширээний багц 12 хүн — 1,800,000₮ (12 хүний)</text>
<text x="100" y="510" font-size="28" fill="#333">Хонины ууц, Загас, Архи 3 шил, Ундаа</text>
</svg>